<style>
:root{
  --navy:#082A5B;
  --cream:#FFF9F1;
  --orange:#FF6B1A;
  --gold:#F9B400;
  --teal:#22C7D6;
  --blue:#2563FF;
  --ink:#082A5B;
  --muted:#6B7A93;
  --face:#FFFFFF;
  --card:#FFFFFF;
  --faceline:rgba(8,42,91,.10);
  --tick:rgba(8,42,91,.18);
  --line:rgba(8,42,91,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:Nunito,"Segoe UI",system-ui,sans-serif;
  min-height:100dvh;
  display:flex;
  justify-content:center;
}
.app{
  width:100%;max-width:460px;padding:18px 16px 28px;min-height:100dvh;
  display:grid;gap:16px;align-content:center;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"head" "clock" "info";
}
header{grid-area:head}
.clockpane{grid-area:clock;display:flex;min-width:0;min-height:0}
.infopane{grid-area:info;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px}
.who{font-family:"Baloo 2",Nunito,sans-serif;font-weight:700;font-size:26px;line-height:1.1;letter-spacing:-.01em;flex:1;min-width:0}
.who span{display:block;font-family:Nunito;font-weight:600;font-size:13px;color:var(--muted);letter-spacing:0}
.hbtn{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;height:40px;padding:0 14px;
  font-family:Nunito;font-weight:700;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
}
.hbtn:hover{border-color:rgba(8,42,91,.3)}
.hbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hbtn.icon{width:40px;padding:0;justify-content:center}

/* ---------- clock ---------- */
.clockwrap{position:relative;width:100%;aspect-ratio:1;max-width:380px;margin:2px auto 0}svg.clock{width:100%;height:100%;display:block;overflow:visible}
.seg{cursor:pointer;transition:opacity .25s ease}
.facedisc{fill:var(--face);stroke:var(--faceline);stroke-width:2}
.tick{stroke:var(--tick)}
.ringtrack{stroke:var(--tick)}
.hourhand{stroke:var(--ink)}
.hub{fill:var(--ink)}
.hubdot{fill:var(--cream)}
body{transition:background-color .6s ease,color .6s ease}
body.night{
  --cream:#0C1526;--face:#16203A;--faceline:rgba(255,255,255,.10);
  --ink:#E7EDF8;--muted:#8A9AB5;--line:rgba(255,255,255,.14);--tick:rgba(255,255,255,.22);
}
body.night{--card:#16203A}
body.night .ev.is-now{background:#1E2A48;border-color:rgba(255,255,255,.22)}
body.night .segbtn[aria-selected=true]{box-shadow:none;background:#233156}
body.night .segbar{background:rgba(255,255,255,.06)}
body.night .switch{background:rgba(255,255,255,.2)}
body.night .warn{color:#F9B400;background:rgba(249,180,0,.12)}
body.night .daypick button[aria-pressed=true]{background:#2563FF;border-color:#2563FF}
body.night .pick[aria-pressed=true]{border-color:var(--ink)}
body.night .btn.ghost{color:var(--ink)}
body.night .numeral{opacity:.7}
/* a bedroom screen should not glow; a tap brings it back for a moment */
body.night .app,body.night .sheet{filter:brightness(.5) saturate(.75);transition:filter .7s ease}
body.night.lit .app,body.night.lit .sheet{filter:none}
.numeral{font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:20px;fill:var(--navy);opacity:.55;text-anchor:middle;dominant-baseline:central}
.daylabel{font-family:Nunito;font-weight:700;font-size:12.5px;fill:var(--muted);text-anchor:middle}

/* ---------- now band ---------- */
.now{
  flex:0 0 auto;border-radius:26px;padding:16px 18px;color:#fff;
  display:flex;align-items:center;gap:14px;
  background:var(--navy);position:relative;overflow:hidden;
}
.now .ic{flex:0 0 auto;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.now .ic svg{width:26px;height:26px}
.now .txt{flex:1;min-width:0}
.now .k{font-family:Nunito;font-weight:700;font-size:12.5px;opacity:.75}
.now .v{font-family:"Baloo 2",Nunito,sans-serif;font-weight:700;font-size:27px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .left{font-family:Nunito;font-weight:600;font-size:13.5px;opacity:.85;margin-top:1px}

/* ---------- next ---------- */
.next{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:2px 6px}
.next .dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.next .dot svg{width:20px;height:20px}
.next .l{font-family:Nunito;font-weight:700;font-size:12px;color:var(--muted)}
.next .n{font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:18px}
.next .t{margin-left:auto;font-family:Nunito;font-weight:700;font-size:15px;color:var(--muted)}

/* ---------- editor sheet ---------- */
.sheet{position:fixed;inset:0;background:var(--cream);z-index:40;display:none;overflow-y:auto}
.sheet.open{display:block}
.sheet .inner{max-width:460px;margin:0 auto;padding:16px 16px 40px}
.sheet h2{font-family:"Baloo 2",Nunito,sans-serif;font-weight:700;font-size:24px;margin:0;flex:1}
.sheetbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.segbar{display:flex;gap:4px;background:rgba(8,42,91,.07);border-radius:999px;padding:5px;margin-bottom:12px}
.segbtn{
  flex:1 1 0;min-width:0;border:none;background:transparent;border-radius:999px;
  padding:11px 2px 9px;cursor:pointer;position:relative;
  font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:15px;color:var(--muted);
}
.segbtn[data-today=true]::after{
  content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;
  border-radius:50%;background:var(--orange);
}
.copypanel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.cp-title{font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:17px;margin-bottom:12px}
.daypick{display:flex;flex-wrap:wrap;gap:8px}
.daypick button{
  flex:1 1 0;min-width:44px;height:48px;border-radius:14px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:15px;
}
.daypick button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.daypick button:disabled{opacity:.3;cursor:default}
.daypick button:focus-visible,.segbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.segbtn[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(8,42,91,.12)}
.segbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.togglerow{display:none;align-items:center;gap:12px;margin-top:14px}
.togglerow .tl{flex:1}
.togglerow .tn{font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:17px}
.togglerow .td{font-family:Nunito;font-size:12.5px;color:var(--muted);line-height:1.4}
.switch{
  width:60px;height:34px;border-radius:999px;border:none;background:rgba(8,42,91,.18);
  position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s ease;
}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s ease}
.switch[aria-pressed=true]{background:var(--green,#2FB574)}
.switch[aria-pressed=true]::after{transform:translateX(26px)}
.switch:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);
  border-radius:18px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;
}
.row:hover{border-color:rgba(8,42,91,.28)}
.row:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row .sw{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.row .sw svg{width:22px;height:22px}
.row .nm{font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:17px}
.row .tm{font-family:Nunito;font-weight:600;font-size:13px;color:var(--muted)}
.addrow{margin-top:8px;justify-content:center;border-style:dashed;font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:17px;color:var(--muted);padding:14px}
.foot{display:flex;gap:10px;margin-top:18px}
.btn{
  flex:1;border-radius:999px;border:none;padding:14px;cursor:pointer;
  font-family:"Baloo 2",Nunito,sans-serif;font-weight:700;font-size:16px;
}
.btn.primary{background:var(--orange);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.btn.danger{background:transparent;border:1.5px solid rgba(214,40,40,.35);color:#C0392B}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-family:Nunito;font-weight:700;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=time]{
  display:block;width:100%;min-width:0;max-width:100%;
  padding:13px 14px;border:1.5px solid var(--line);border-radius:15px;
  font-family:Nunito;font-weight:600;font-size:16px;color:var(--ink);background:var(--card);
  -webkit-appearance:none;appearance:none;
}
/* iOS renders time inputs at an intrinsic width and centres the value */
.field input[type=time]{text-align:left;font-variant-numeric:tabular-nums;height:52px;line-height:normal}
.field input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0;padding:0}
.field input[type=time]::-webkit-calendar-picker-indicator{margin-left:auto}
.field input:focus{outline:none;border-color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{min-width:0}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.pick{
  width:46px;height:46px;border-radius:15px;border:2px solid transparent;background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);
  box-shadow:inset 0 0 0 1.5px var(--line);
}
.pick svg{width:24px;height:24px}
.pick[aria-pressed=true]{border-color:var(--ink);box-shadow:none;color:var(--ink)}
.pick.col{box-shadow:none}
.pick.col[aria-pressed=true]{border-color:var(--ink)}
.pick:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hint{font-family:Nunito;font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 14px}
.warn{
  font-family:Nunito;font-weight:600;font-size:14px;line-height:1.5;
  background:rgba(249,180,0,.16);border:1.5px solid rgba(249,180,0,.5);
  border-radius:15px;padding:12px 14px;margin:0 0 14px;color:#8A5A00;
}
/* ---------- schedule list (tablet) ---------- */
.schedule{
  display:none;position:relative;flex:1 1 auto;flex-direction:column;gap:6px;
  overflow-y:auto;min-height:0;padding:2px 2px 10px;
  scroll-padding-top:2px;-webkit-overflow-scrolling:touch;
  --fade-top:0px;--fade-bottom:0px;
  mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fade-top),#000 calc(100% - var(--fade-bottom)),transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--fade-top),#000 calc(100% - var(--fade-bottom)),transparent 100%);
}
.schedule.fade-top{--fade-top:26px}
.schedule.fade-bottom{--fade-bottom:26px}
.ev{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--line);
  border-radius:16px;padding:9px 14px;font:inherit;color:inherit;cursor:pointer;
}
.ev:hover{border-color:rgba(8,42,91,.26)}
.ev:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ev .evic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.ev .evic svg{width:20px;height:20px}
.ev .evname{font-family:"Baloo 2",Nunito,sans-serif;font-weight:600;font-size:18px;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .evtime{font-family:Nunito;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.ev .evdur{font-family:Nunito;font-weight:600;font-size:12.5px;color:var(--muted);opacity:.8;white-space:nowrap;min-width:44px;text-align:right}
.ev .evcheck{
  width:32px;height:32px;border-radius:50%;flex:0 0 auto;margin-left:2px;
  border:2px solid var(--line);display:grid;place-items:center;color:transparent;
  transition:background .15s ease,border-color .15s ease,color .15s ease;
}
.ev.is-done .evcheck{background:#2FB574;border-color:#2FB574;color:#fff}
.ev.is-done .evname{text-decoration:line-through;opacity:.55}
.ev.is-done .evic{opacity:.5}
.ev.is-past{opacity:.45}
.ev.is-now{background:rgba(8,42,91,.05);border-color:rgba(8,42,91,.22);padding-top:13px;padding-bottom:13px}
.ev.is-now .evname{font-size:20px}

/* ---------- iPad portrait ---------- */
@media (min-width:700px){
  .app{max-width:780px;padding:30px 36px 34px;gap:20px;height:100dvh;min-height:0;
       grid-template-rows:auto auto minmax(0,1fr);align-content:stretch}
  .infopane{overflow:hidden}
  .who{font-size:36px}
  .who span{font-size:15px}
  .hbtn{height:48px;font-size:16px}
  .hbtn.icon{width:48px}
  .clockwrap{max-width:min(520px,52dvh)}
  .now{padding:20px 24px;border-radius:30px;gap:18px}
  .now .ic{width:54px;height:54px;border-radius:17px}
  .now .ic svg{width:32px;height:32px}
  .now .v{font-size:33px}
  .now .k{font-size:14px}
  .now .left{font-size:16px}
  .next{display:none}
  .schedule{display:flex}
  .sheet .inner{max-width:640px;padding:30px 36px 48px}
  .sheet h2{font-size:29px}
  .row{padding:13px 16px;border-radius:20px}
  .row .nm{font-size:19px}
  .pick{width:54px;height:54px}
  .pick svg{width:28px;height:28px}
}

/* ---------- iPad landscape: clock left, schedule right ---------- */
@media (min-width:820px) and (orientation:landscape){
  .app{
    max-width:1240px;height:100dvh;min-height:0;padding:22px 30px;
    grid-template-columns:minmax(0,1fr) minmax(330px,400px);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"clock head" "clock info";
    column-gap:34px;row-gap:14px;align-content:stretch;
  }
  .clockpane{align-items:center;justify-content:center}
  .clockwrap{width:auto;height:100%;max-width:100%;max-height:100%;aspect-ratio:1;margin:0}
  header{align-self:start}
  .who{font-size:32px}
  .infopane{overflow:hidden}
  .now{padding:16px 20px;border-radius:26px;flex:0 0 auto}
  .now .v{font-size:28px}
  .now .ic{width:48px;height:48px}
  .schedule{display:flex;flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div class="who" id="who">Saglit<span id="subtitle">Monday</span></div>
    <button class="hbtn icon" id="editBtn" type="button" aria-label="Edit routine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M15.5 3.5l5 5L8 21H3v-5z"/><path d="M13.5 5.5l5 5"/></svg>
    </button>
  </header>

  <div class="clockpane">
    <div class="clockwrap">
      <svg class="clock" id="clock" viewBox="0 0 360 360" role="img" aria-label="Routine clock"></svg>
    </div>
  </div>

  <div class="infopane">
    <div class="now" id="nowBand">
      <div class="ic" id="nowIcon"></div>
      <div class="txt">
        <div class="k" id="nowKicker">Now</div>
        <div class="v" id="nowName">—</div>
        <div class="left" id="nowLeft"></div>
      </div>
    </div>

    <div class="next" id="nextRow"></div>
    <div class="schedule" id="schedule"></div>
  </div>
</div>

<!-- list sheet -->
<div class="sheet" id="listSheet">
  <div class="inner">
    <div class="sheetbar">
      <h2 id="listTitle">Routine</h2>
      <button class="hbtn" id="listClose" type="button">Done</button>
    </div>
    <div class="segbar" id="routineTabs" role="tablist"></div>
    <div class="copypanel" id="copyPanel" hidden>
      <div class="cp-title" id="copyTitle">Copy to</div>
      <div class="daypick" id="copyDays"></div>
      <div class="foot">
        <button class="btn ghost" id="copyCancel" type="button">Cancel</button>
        <button class="btn primary" id="copyApply" type="button">Copy</button>
      </div>
    </div>
    <p class="hint" id="listHint">Tap anything to change it.</p>
    <div class="rows" id="rows"></div>
    <button class="row addrow" id="addBtn" type="button">+ Add activity</button>
    <div class="foot">
      <button class="btn ghost" id="copyBtn" type="button">Copy this day to…</button>
    </div>
    <div class="togglerow" id="awakeRow">
      <div class="tl">
        <div class="tn">Keep screen awake</div>
        <div class="td">For leaving the clock on a shelf. Add to your Home Screen first.</div>
      </div>
      <button class="switch" id="awakeBtn" type="button" aria-pressed="false" aria-label="Keep screen awake"></button>
    </div>
    <div class="foot">
      <button class="btn ghost" id="exportBtn" type="button">Save a backup</button>
      <button class="btn ghost" id="importBtn" type="button">Restore</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    <p class="hint" id="backupNote">A backup file holds all seven days. Keep one somewhere safe — clearing Safari's website data wipes the routines.</p>
    <div class="foot">
      <button class="btn ghost" id="resetBtn" type="button">Reset to default</button>
    </div>
  </div>
</div>

<!-- edit sheet -->
<div class="sheet" id="editSheet">
  <div class="inner">
    <div class="sheetbar">
      <h2 id="editTitle">Activity</h2>
      <button class="hbtn" id="editCancel" type="button">Cancel</button>
    </div>
    <div class="field">
      <label for="fName" id="lName">Name</label>
      <input type="text" id="fName" maxlength="22" autocomplete="off">
    </div>
    <div class="two">
      <div class="field">
        <label for="fStart" id="lStart">Starts</label>
        <input type="time" id="fStart" step="300">
      </div>
      <div class="field">
        <label for="fEnd" id="lEnd">Ends</label>
        <input type="time" id="fEnd" step="300">
      </div>
    </div>
    <div class="field">
      <label id="lIcon">Picture</label>
      <div class="picker" id="iconPicker"></div>
    </div>
    <p class="warn" id="overlapWarn" hidden></p>
    <div class="field">
      <label id="lColor">Colour</label>
      <div class="picker" id="colorPicker"></div>
    </div>
    <div class="foot">
      <button class="btn primary" id="saveBtn" type="button">Save</button>
    </div>
    <div class="foot">
      <button class="btn danger" id="delBtn" type="button">Delete</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============ icons ============ */
var S='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
var ICONS={
  sun:'<circle cx="12" cy="12" r="4.2" '+S+'/><path '+S+' d="M12 2.2v2M12 19.8v2M2.2 12h2M19.8 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/>',
  moon:'<path '+S+' d="M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5a8.6 8.6 0 1 0 11.3 11.3z"/>',
  bowl:'<path '+S+' d="M2.8 11.5h18.4a9.2 9.2 0 0 1-18.4 0z"/><path '+S+' d="M7.5 7.5c0-1.6 1-1.6 1-3.2M12 7.5c0-1.6 1-1.6 1-3.2M16.5 7.5c0-1.6 1-1.6 1-3.2"/>',
  cup:'<path '+S+' d="M4 5.5h13v7.5a5 5 0 0 1-10 0z"/><path '+S+' d="M17 7.5h2.2a2.4 2.4 0 0 1 0 4.8H17M3 20.5h15"/>',
  backpack:'<path '+S+' d="M6 9.5a6 6 0 0 1 12 0v10a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19.5z"/><path '+S+' d="M9 9.5v-3a3 3 0 0 1 6 0v3M9 14.5h6"/>',
  book:'<path '+S+' d="M12 6.6S10 4.6 6 4.6H3v12.8h3c4 0 6 2 6 2s2-2 6-2h3V4.6h-3c-4 0-6 2-6 2z"/><path '+S+' d="M12 6.6v12.8"/>',
  pencil:'<path '+S+' d="M15.5 3.5l5 5L8 21H3v-5z"/><path '+S+' d="M13.5 5.5l5 5"/>',
  ball:'<circle cx="12" cy="12" r="9" '+S+'/><path '+S+' d="M12 3c-3.2 3.4-3.2 14.6 0 18M12 3c3.2 3.4 3.2 14.6 0 18M3.3 10.5c4.5 1.6 13 1.6 17.4 0"/>',
  bath:'<path '+S+' d="M3 12.5h18v2.5a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path '+S+' d="M6 12.5V5.8A2.3 2.3 0 0 1 10.4 5M6.5 21l-1 1.5M17.5 21l1 1.5"/>',
  sparkle:'<path '+S+' d="M10 3l1.7 4.6L16.3 9.3 11.7 11 10 15.6 8.3 11 3.7 9.3 8.3 7.6z"/><path '+S+' d="M18 14.5l.9 2.2 2.2.8-2.2.9-.9 2.1-.9-2.1-2.1-.9 2.1-.8z"/>',
  box:'<path '+S+' d="M3 8h18v11.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"/><path '+S+' d="M3 8l2.2-4.5h13.6L21 8M12 3.5V21"/>',
  tv:'<rect x="2.5" y="4.5" width="19" height="12.5" rx="2.2" '+S+'/><path '+S+' d="M8.5 21h7M12 17v4"/>',
  shirt:'<path '+S+' d="M8.5 3.2L12 5l3.5-1.8L20.5 6l-2.4 4L16 9v11.8H8V9l-2.1 1L3.5 6z"/>',
  run:'<circle cx="14.5" cy="4.6" r="2.1" '+S+'/><path '+S+' d="M13 21l-1.2-5.2-3-2.8 1.2-5 4 2 1.8 3M8.8 13l-3 1.2-1 4.3M15 9.2l4 .9"/>',
  music:'<path '+S+' d="M9 18V5.2l11-2v12.6"/><circle cx="6" cy="18" r="3" '+S+'/><circle cx="17" cy="15.8" r="3" '+S+'/>',
  heart:'<path '+S+' d="M12 20.3s-7.2-4.5-7.2-9.3A4.1 4.1 0 0 1 12 8.4a4.1 4.1 0 0 1 7.2 2.6c0 4.8-7.2 9.3-7.2 9.3z"/>'
};
var ICON_KEYS=Object.keys(ICONS);
function svgIcon(k,size){
  return '<svg viewBox="0 0 24 24" width="'+(size||24)+'" height="'+(size||24)+'">'+(ICONS[k]||ICONS.sun)+'</svg>';
}

/* ============ palette ============ */
var COLORS=['#FF6B1A','#F9B400','#22C7D6','#2563FF','#7A5AF8','#2FB574','#EC5B8C','#0E7C86'];

/* ============ defaults ============ */
function D(en,s,e,icon,color){return{id:Math.random().toString(36).slice(2,9),en:en,s:s,e:e,icon:icon,color:color};}
/* ---- default week ----
   Mon-Fri: breakfast 6:00, prep 6:30, school 7:30, midday bath 11:20, lunch 11:45,
   back to class 12:30, out 3:00 Mon / 2:00 Tue-Fri, nap 3:00-5:00.
   Sat-Sun: breakfast 8:00, bath 12:00, lunch 12:30, nap 2:00-4:00.
   Every day: dinner 7:00-8:00. Bath 8:00pm Sun-Thu; Fri and Sat bathe at midday only. Bed 9:00, 11:00 Fri & Sat.
   Screens: 1h Mon-Fri, 2h Sat-Sun. */
var MORNING=[
  D('Breakfast',360,390,'bowl','#FF6B1A'),
  D('Prep for school',390,405,'shirt','#22C7D6'),
  D('Go to school',405,450,'run','#0E7C86')
];
/* the midday break splits the school day in two */
function schoolBlocks(endMin){return[
  D('School',450,680,'backpack','#2563FF'),
  D('Bath',680,705,'bath','#22C7D6'),
  D('Lunch',705,730,'bowl','#FF6B1A'),
  D('Prep after lunch',730,750,'sparkle','#22C7D6'),
  D('Afternoon class',750,endMin,'backpack','#2563FF')
];}
var AFTER_SCHOOL=[
  D('Come home',840,870,'run','#0E7C86'),
  D('Merienda',870,900,'cup','#F9B400')
];
var NAP=[D('Afternoon nap',900,1020,'moon','#7A5AF8')];
var SCHOOL_EVENING=[
  D('Play time',1020,1050,'ball','#2FB574'),
  D('Homework',1050,1080,'pencil','#0E7C86'),
  D('Screen time',1080,1140,'tv','#EC5B8C'),
  D('Dinner',1140,1200,'bowl','#FF6B1A'),
  D('Bath',1200,1230,'bath','#22C7D6'),
  D('Story time',1230,1260,'book','#7A5AF8'),
  D('Sleep',1260,360,'moon','#2563FF')
];
function cat(){
  var out=[];
  for(var i=0;i<arguments.length;i++)
    for(var j=0;j<arguments[i].length;j++)out.push(arguments[i][j]);
  return cloneBlocks(out);
}
function mondayDefaults(){return cat(MORNING,schoolBlocks(900),NAP,SCHOOL_EVENING);}
function schoolDayDefaults(){return cat(MORNING,schoolBlocks(840),AFTER_SCHOOL,NAP,SCHOOL_EVENING);}
function fridayDefaults(){
  return cat(MORNING,schoolBlocks(840),AFTER_SCHOOL,NAP,[
    D('Play time',1020,1080,'ball','#2FB574'),
    D('Family time',1080,1140,'heart','#F9B400'),
    D('Dinner',1140,1200,'bowl','#FF6B1A'),
    D('Screen time',1200,1260,'tv','#EC5B8C'),
    D('Music and dancing',1260,1305,'music','#EC5B8C'),
    D('Wind down',1305,1365,'sparkle','#22C7D6'),
    D('Story time',1365,1380,'book','#7A5AF8'),
    D('Sleep',1380,450,'moon','#2563FF')
  ]);
}
function saturdayDefaults(){
  return cat([
    D('Wake up',450,480,'sun','#F9B400'),
    D('Breakfast',480,525,'bowl','#FF6B1A'),
    D('Get ready',525,555,'shirt','#22C7D6'),
    D('Help at home',555,615,'box','#0E7C86'),
    D('Play time',615,720,'ball','#2FB574'),
    D('Bath',720,750,'bath','#22C7D6'),
    D('Lunch',750,810,'bowl','#FF6B1A'),
    D('Reading time',810,840,'book','#7A5AF8'),
    D('Afternoon nap',840,960,'moon','#7A5AF8'),
    D('Screen time',960,1080,'tv','#EC5B8C'),
    D('Outdoor play',1080,1140,'ball','#2FB574'),
    D('Dinner',1140,1200,'bowl','#FF6B1A'),
    D('Family time',1200,1320,'heart','#F9B400'),
    D('Wind down',1320,1365,'sparkle','#22C7D6'),
    D('Story time',1365,1380,'book','#7A5AF8'),
    D('Sleep',1380,480,'moon','#2563FF')
  ]);
}
function sundayDefaults(){
  return cat([
    D('Breakfast',480,525,'bowl','#FF6B1A'),
    D('Get ready',525,555,'shirt','#22C7D6'),
    D('Family time',555,660,'heart','#F9B400'),
    D('Play time',660,720,'ball','#2FB574'),
    D('Bath',720,750,'bath','#22C7D6'),
    D('Lunch',750,810,'bowl','#FF6B1A'),
    D('Reading time',810,840,'book','#7A5AF8'),
    D('Afternoon nap',840,960,'moon','#7A5AF8'),
    D('Screen time',960,1080,'tv','#EC5B8C'),
    D('Outdoor play',1080,1125,'ball','#2FB574'),
    D('Pack school bag',1125,1140,'backpack','#2563FF'),
    D('Dinner',1140,1200,'bowl','#FF6B1A'),
    D('Bath',1200,1230,'bath','#22C7D6'),
    D('Story time',1230,1245,'book','#7A5AF8'),
    D('Get ready for bed',1245,1260,'sparkle','#22C7D6'),
    D('Sleep',1260,360,'moon','#2563FF')
  ]);
}
function dayDefaults(d){
  if(d===0)return sundayDefaults();
  if(d===1)return mondayDefaults();
  if(d===5)return fridayDefaults();
  if(d===6)return saturdayDefaults();
  return schoolDayDefaults();
}

function cloneBlocks(list){return list.map(function(b){return{id:Math.random().toString(36).slice(2,9),en:b.en,s:b.s,e:b.e,icon:b.icon,color:b.color};});}
var KEY='saglit.v1',OLDKEY='routineclock.v1';
var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var DAYS_SHORT=['Su','Mo','Tu','We','Th','Fr','Sa'];
function freshWeek(){
  var r={};
  for(var d=0;d<7;d++)r[d]=dayDefaults(d);
  return r;
}
var state={routines:freshWeek(),awake:false,done:{},doneDate:''};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){
    var p=JSON.parse(raw);
    if(p&&p.routines){
      state.awake=!!p.awake;
      if(p.done&&p.doneDate===new Date().toDateString()){state.done=p.done;state.doneDate=p.doneDate;}
      if(Array.isArray(p.routines.weekday)||Array.isArray(p.routines.weekend)){
        /* previous two-routine format */
        for(var d=0;d<7;d++){
          var src=(d===0||d===6)?p.routines.weekend:p.routines.weekday;
          if(Array.isArray(src)&&src.length)state.routines[d]=cloneBlocks(src);
        }
      }else{
        for(var k=0;k<7;k++)if(Array.isArray(p.routines[k])&&p.routines[k].length)state.routines[k]=p.routines[k];
      }
    }
  }else{
    var legacy=localStorage.getItem(OLDKEY);
    if(legacy){
      var q=JSON.parse(legacy);
      if(q&&Array.isArray(q.blocks)&&q.blocks.length)for(var e=1;e<6;e++)state.routines[e]=cloneBlocks(q.blocks);
    }

/* ============ time helpers ============ */

  var h=Math.floor(m/60),mi=m%60,ap=h<12?'AM':'PM',h12=h%12;if(h12===0)h12=12;
  return h12+':'+(mi<10?'0':'')+mi+' '+ap;
}
function toHHMM(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mi=m%60;return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;}
function fromHHMM(v){var p=(v||'').split(':');var h=parseInt(p[0],10),mi=parseInt(p[1],10);if(isNaN(h)||isNaN(mi))return null;return h*60+mi;}
function dur(b){var d=b.e-b.s;if(d<=0)d+=1440;return d;}
/* how far into block b is minute m? null if outside */
function progress(b,m){
  var d=dur(b);

  return (off<d)?off:null;
}
function occurrences(){
  /* today's activities, plus yesterday's that are still running and tomorrow's
     first ones, so a bedtime crossing midnight stays attached to the day it began */
  var d=new Date().getDay(),out=[],i,b,L;
  var prev=state.routines[(d+6)%7],today=state.routines[d],next=state.routines[(d+1)%7];
  for(i=0;i<prev.length;i++){b=prev[i];var st=b.s-1440,dr=dur(b);
    if(st+dr>0)out.push({b:b,s:st,dur:dr,carry:true});}
  L=today;for(i=0;i<L.length;i++){b=L[i];out.push({b:b,s:b.s,dur:dur(b),carry:false});}
  for(i=0;i<next.length;i++){b=next[i];out.push({b:b,s:b.s+1440,dur:dur(b),carry:false,future:true});}
  out.sort(function(a,c){return a.s-c.s;});

}
function currentOcc(m){
  var o=occurrences();

}

  var span=a2-a1;if(span<=0)return'';
  if(span>359.9)span=359.9,a2=a1+span;
  var big=span>180?1:0;
  var p1=pt(rOut,a1),p2=pt(rOut,a2),p3=pt(rIn,a2),p4=pt(rIn,a1);
  return 'M'+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+
         'A'+rOut+' '+rOut+' 0 '+big+' 1 '+p2[0].toFixed(2)+' '+p2[1].toFixed(2)+
         'L'+p3[0].toFixed(2)+' '+p3[1].toFixed(2)+
         'A'+rIn+' '+rIn+' 0 '+big+' 0 '+p4[0].toFixed(2)+' '+p4[1].toFixed(2)+'Z';
}
function strokeArc(r,a1,a2){
  var span=a2-a1;if(span<=0)return'';
  var big=span>180?1:0,p1=pt(r,a1),p2=pt(r,a2);
  return 'M'+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+'A'+r+' '+r+' 0 '+big+' 1 '+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
}
/* which 12h window: 0 = 00:00-12:00, 720 = 12:00-24:00 */
function windowStart(m){return m<720?0:720;}
/* pieces of block b visible in window [w,w+720) -> [[startMin,endMin]] absolute-ish */
function piecesIn(o,w){
  var a=Math.max(o.s,w),z=Math.min(o.s+o.dur,w+720);
  return (z-a>0.4)?[[a,z]]:[];
}

function renderFace(){
  var m=nowMin(),w=windowStart(m),cur=currentBlock(m);
  var L=occurrences(),curO=currentOcc(m);
  var key=w+'|'+night+'|'+(curO?curO.b.id+curO.s:'-')+'|'+L.map(function(o){return o.b.id+o.s+o.dur+o.b.icon+o.b.color;}).join(',');
  if(key===faceKey)return;
  faceKey=key;
  var g='';

  /* face */
  g+='<circle cx="180" cy="180" r="168" class="facedisc"/>';

  /* segments */
  for(var i=0;i<L.length;i++){
    var o=L[i],b=o.b;
    var pieces=piecesIn(o,w);
    var active=(curO===o);
    for(var j=0;j<pieces.length;j++){
      var p0=pieces[j][0],p1=pieces[j][1];
      var a1=ang(p0),a2=ang(p1);
      if(a2<=a1)a2=a1+(p1-p0)*0.5;
      var rO=active?R_OUT+9:R_OUT, rI=active?R_IN-3:R_IN;
      g+='<path class="seg" data-id="'+b.id+'" d="'+arcPath(a1,a2,rO,rI)+'" fill="'+b.color+'" opacity="'+(active?(night?.85:1):(night?.16:.38))+'"/>';
      var span=a2-a1;
      if(span>=13){
        var mid=(a1+a2)/2,pp=pt(active?R_ICON+4:R_ICON,mid);
        var sz=active?26:22;
        g+='<g transform="translate('+(pp[0]-sz/2).toFixed(1)+','+(pp[1]-sz/2).toFixed(1)+')" style="color:#fff" opacity="'+(active?1:.9)+'" pointer-events="none">'+
           '<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'">'+(ICONS[b.icon]||ICONS.sun)+'</svg></g>';
      }
    }
  }

  /* numerals + minute ticks */
  for(var k=0;k<60;k++){
    if(k%5===0)continue;
    var tp=pt(R_IN-7,k*6),tp2=pt(R_IN-11,k*6);
    g+='<line x1="'+tp[0].toFixed(1)+'" y1="'+tp[1].toFixed(1)+'" x2="'+tp2[0].toFixed(1)+'" y2="'+tp2[1].toFixed(1)+'" class="tick" stroke-width="1.4" stroke-linecap="round"/>';
  }
  for(var n=1;n<=12;n++){
    var np=pt(R_NUM,n*30);
    g+='<text class="numeral" x="'+np[0].toFixed(1)+'" y="'+np[1].toFixed(1)+'">'+n+'</text>';
  }
  g+='<text class="daylabel" x="180" y="232">'+(w===0?t().morning:t().evening)+'</text>';
  faceG.innerHTML=g;
}

var ACCENT='#FF6B1A',ACCENT_ALT='#0E7C86';
function hueOf(hex){
  var r=parseInt(hex.substr(1,2),16)/255,g2=parseInt(hex.substr(3,2),16)/255,b2=parseInt(hex.substr(5,2),16)/255;
  var mx=Math.max(r,g2,b2),mn=Math.min(r,g2,b2),d=mx-mn,h=0;
  if(d===0)return 0;
  if(mx===r)h=60*(((g2-b2)/d)%6);else if(mx===g2)h=60*((b2-r)/d+2);else h=60*((r-g2)/d+4);
  return (h+360)%360;
}
function hueGap(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d;}

var R_RING=173,RING_W=8;

  if(s===null||e===null)return;
  if(s===e)e=s+1;
  var dv=e-s;if(dv<=0)dv+=1440;
  if(!overlapAck){
    var clash=findClashes(s,dv);
    if(clash.length){
      warnEl.textContent='This overlaps '+clash.join(' and ')+'. Tap Save again to keep both, or change the times.';
      warnEl.hidden=false;overlapAck=true;
      document.getElementById('saveBtn').textContent='Save anyway';
      warnEl.scrollIntoView({block:'nearest'});
      return;
    }
  }
  if(editing){
    editing.en=name;
    editing.s=s;editing.e=((e%1440)+1440)%1440;editing.icon=draft.icon;editing.color=draft.color;
  }else{
    editList().push(D(name,s,((e%1440)+1440)%1440,draft.icon,draft.color));
  }
  save();schedKey='';editSheet.classList.remove('open');renderRows();renderAll();
};
document.getElementById('delBtn').onclick=function(){
  if(!editing)return;
  state.routines[editKey]=editList().filter(function(b){return b.id!==editing.id;});
  save();schedKey='';editSheet.classList.remove('open');renderRows();renderAll();
};

/* ============ preview a block ============ */
function peek(id){
  var L=blocks().concat(editList());
  for(var i=0;i<L.length;i++){
    if(L[i].id===id){
      var b=L[i];
      nowBand.style.background=b.color;
      nowIcon.innerHTML=svgIcon(b.icon,26);
      nowKicker.textContent=fmt(b.s)+' – '+fmt(b.e);
      nowName.textContent=label(b);
      nowLeft.textContent=durText(dur(b));
      clearTimeout(clock._peek);
      clock._peek=setTimeout(renderStatus,2600);
      return;
    }
  }
}
clock.addEventListener('click',function(ev){
  var p=ev.target.closest('.seg');if(!p)return;
  peek(p.getAttribute('data-id'));
});

/* ============ routine tabs + keep awake ============ */
var routineTabs=document.getElementById('routineTabs'),
    awakeRow=document.getElementById('awakeRow'),
    awakeBtn=document.getElementById('awakeBtn'),
    copyPanel=document.getElementById('copyPanel'),
    copyDays=document.getElementById('copyDays'),
    copyTitle=document.getElementById('copyTitle');

function renderTabs(){
  var td=todayKey(),h='';
  for(var d=0;d<7;d++){
    h+='<button class="segbtn" type="button" role="tab" data-k="'+d+'"'+
       ' aria-selected="'+(d===editKey?'true':'false')+'"'+
       ' data-today="'+(d===td?'true':'false')+'"'+
       ' aria-label="'+DAYS[d]+'">'+DAYS_SHORT[d]+'</button>';
  }
  routineTabs.innerHTML=h;
  document.getElementById('listHint').textContent=
    (editKey===td)?('Today. Tap an activity to change it.'):(DAYS[editKey]+'. Tap an activity to change it.');
}
routineTabs.onclick=function(ev){
  var b=ev.target.closest('.segbtn');if(!b)return;
  editKey=parseInt(b.getAttribute('data-k'),10);
  hideCopy();renderTabs();renderRows();
};

/* ---- copy one day's routine onto others ---- */
var copyTargets={};
function hideCopy(){copyPanel.hidden=true;copyTargets={};}
function renderCopy(){
  copyTitle.textContent='Copy '+DAYS[editKey]+' to';
  var h='';
  for(var d=0;d<7;d++){
    h+='<button type="button" data-d="'+d+'" aria-pressed="'+(copyTargets[d]?'true':'false')+'"'+
       (d===editKey?' disabled':'')+' aria-label="'+DAYS[d]+'">'+DAYS_SHORT[d]+'</button>';
  }
  copyDays.innerHTML=h;
}
document.getElementById('copyBtn').onclick=function(){
  copyTargets={};copyPanel.hidden=false;renderCopy();
  copyPanel.scrollIntoView({block:'nearest'});
};
copyDays.onclick=function(ev){
  var b=ev.target.closest('button');if(!b||b.disabled)return;
  var d=b.getAttribute('data-d');
  copyTargets[d]=!copyTargets[d];renderCopy();
};
document.getElementById('copyCancel').onclick=hideCopy;
document.getElementById('copyApply').onclick=function(){
  var src=editList(),n=0;
  for(var d=0;d<7;d++){if(copyTargets[d]&&d!==editKey){state.routines[d]=cloneBlocks(src);n++;}}
  if(n){save();schedKey='';renderAll();}
  hideCopy();
};
if(wakeSupported)awakeRow.style.display='flex';
awakeBtn.setAttribute('aria-pressed',state.awake?'true':'false');
awakeBtn.onclick=function(){
  state.awake=!state.awake;save();
  awakeBtn.setAttribute('aria-pressed',state.awake?'true':'false');
  if(state.awake)requestWake();else releaseWake();
};

/* ============ backup / restore ============ */
function stamp(){
  var d=new Date(),z=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
}
document.getElementById('exportBtn').onclick=function(){
  var payload={app:'routine-clock',version:3,saved:new Date().toISOString(),routines:state.routines};
  var txt=JSON.stringify(payload,null,2);
  try{
    var url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    var a=document.createElement('a');
    a.href=url;a.download='saglit-'+stamp()+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  }catch(e){
    window.prompt('Copy this backup and keep it somewhere safe:',txt);
  }
};
var importFile=document.getElementById('importFile');
document.getElementById('importBtn').onclick=function(){importFile.value='';importFile.click();};
importFile.onchange=function(){
  var f=importFile.files&&importFile.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var data;
    try{data=JSON.parse(r.result);}catch(e){window.alert('That file could not be read.');return;}
    var src=data&&data.routines;
    if(!src){window.alert('That does not look like a routine backup.');return;}
    var fresh={},found=0;
    for(var d=0;d<7;d++){
      var list=Array.isArray(src[d])?src[d]:(d===0||d===6?src.weekend:src.weekday);
      if(Array.isArray(list)&&list.length){fresh[d]=cloneBlocks(list);found++;}
      else fresh[d]=dayDefaults(d);
    }
    if(!found){window.alert('That backup has no activities in it.');return;}
    if(!window.confirm('Replace all seven routines with this backup?'))return;
    state.routines=fresh;state.done={};save();
    sortBlocks();schedKey='';faceKey='';renderTabs();renderRows();renderAll();
  };
  r.readAsText(f);
};

/* ============ boot ============ */
buildPickers();
sortBlocks();
renderTabs();
requestWake();
renderAll();
var lastMin=-1,lastDate=new Date().toDateString();
function applyNight(){
  var n=computeNight(nowMin());
  if(n!==night){night=n;document.body.classList.toggle('night',night);if(!night)document.body.classList.remove('lit');faceKey='';}
}
setInterval(function(){
  var m=Math.floor(nowMin()),today=new Date().toDateString();
  if(today!==lastDate){
    lastDate=today;state.done={};save();
    if(!listSheet.classList.contains('open'))editKey=todayKey();
    faceKey='';schedKey='';renderAll();
  }
  applyNight();
  renderClock();
  if(m!==lastMin){lastMin=m;renderStatus();renderSchedule();}
},1000);
})();
</script>
